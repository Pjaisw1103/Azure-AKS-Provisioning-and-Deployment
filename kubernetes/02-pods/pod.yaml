apiVersion: v1
kind: Pod
metadata:
  name: nginx-standalone-pod
  namespace: dev
  labels:
    app: demo-nginx
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
      name: http
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "250m"
---
apiVersion: v1
kind: Pod
metadata:
  name: firefox-client-pod
  namespace: dev
  labels:
    app: firefox-client
    tier: client
spec:
  containers:
  - name: firefox
    image: lscr.io/linuxserver/firefox:latest
    ports:
    - containerPort: 3001
      name: web-ui
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
