# Internal ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: webapp-clusterip-service
  namespace: dev
  labels:
    app: webapp
spec:
  type: ClusterIP
  selector:
    app: webapp
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80

---
# External LoadBalancer Service (Azure Public IP provisioned automatically)
apiVersion: v1
kind: Service
metadata:
  name: webapp-loadbalancer-service
  namespace: dev
  labels:
    app: webapp
spec:
  type: LoadBalancer
  selector:
    app: webapp
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
